spring.application.name=codexhotel

# MongoDB
spring.mongodb.uri=${MONGODB_URI}

# JWT
codexhotel.jwt.secret=${CODEXHOTEL_JWT_SECRET}
codexhotel.jwt.expiration-ms=86400000

# Seeded administrator
codexhotel.admin.name=${CODEXHOTEL_ADMIN_NAME:Hotel Administrator}
codexhotel.admin.email=${CODEXHOTEL_ADMIN_EMAIL:admin@codexhotel.com}
codexhotel.admin.password=${CODEXHOTEL_ADMIN_PASSWORD}
codexhotel.admin.phone-number=${CODEXHOTEL_ADMIN_PHONE:08012345678}

# Room inventory
codexhotel.rooms.single-count=12
codexhotel.rooms.double-count=8
codexhotel.rooms.suite-count=4

# CORS
codexhotel.cors.allowed-origins=${CODEXHOTEL_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://codex-hotel.vercel.app}