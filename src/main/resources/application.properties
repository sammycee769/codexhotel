spring.application.name=codexhotel

# MongoDB — Boot 4 removed the spring.data.mongodb.* prefix (deprecated at error level since
# 4.0.0). Using the old name is silently ignored and the app falls back to the default
# mongodb://localhost/test, so this must stay spring.mongodb.*
spring.mongodb.uri=mongodb://localhost:27017/codexhotel

# JWT — HS256 requires a key of at least 32 bytes. Override in production.
codexhotel.jwt.secret=${CODEXHOTEL_JWT_SECRET:codexhotel-dev-secret-key-change-me-in-production-0123456789}
codexhotel.jwt.expiration-ms=86400000

# Seeded administrator, created on startup only when no ADMIN exists yet.
# Phone must satisfy the Nigerian pattern enforced on User: ^(\\+234|0)(70|8[01]|9[01])[0-9]{8}$
codexhotel.admin.name=Hotel Administrator
codexhotel.admin.email=admin@codexhotel.com
codexhotel.admin.password=Admin@12345
codexhotel.admin.phone-number=08012345678

# Inventory seeded on startup only when the rooms collection is empty. Numbered contiguously
# from the bottom of each band — Deluxe 101.., Junior 201.., Executive 301.. — so a count is
# capped by the band's size (99 for Deluxe and Junior; Executive is open-ended).
codexhotel.rooms.single-count=12
codexhotel.rooms.double-count=8
codexhotel.rooms.suite-count=4

# The frontend dev server origin allowed through CORS.
codexhotel.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
